<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="nav"><p>Rock Paper Scissors</p></div>
    </nav>
    <div class="main">
      <img class="elm" id="rock" src="img/rock.jpg" alt="rock" />
      <img class="elm" id="paper" src="img/paper.jfif" alt="paper" />

      <img class="elm" id="scissors" src="img/scissors.jpg" alt="scissors" />
    </div>
    <div class="score">
      <div class="score1">
        <p id="user-score">0</p>
        <p>My</p>
      </div>
      <div class="score2">
        <p id="computer-score">0</p>
        <p>computer</p>
      </div>
    </div>
    <div class="msg-cont"><p id="msg">play your move</p></div>
    <script src="script.js"></script>
  </body>
</html>
